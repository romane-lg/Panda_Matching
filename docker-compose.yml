version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: panda-matching-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: panda
      POSTGRES_PASSWORD: panda
      POSTGRES_DB: panda_matching
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panda -d panda_matching"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
